services:
  app:
    build: .
    container_name: url-shortener
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=http://localhost:3000
      - DATABASE_PATH=./data/database.sqlite
    volumes:
      - ./data:/app/data
